[versions]
agp = "8.9.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
coreKtx = "1.16.0"
splashscreen = "1.0.1"
swiperefreshlayout = "1.1.0"
appcompat = "1.7.0"
material = "1.13.0"
activityKtx = "1.10.1"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
lifecycle = "2.9.4"
media3 = "1.8.0"
# NextLib FFmpeg extension for Media3 — version MUST match media3
# exactly (<media3>-<lib>). Prebuilt AAR from Maven Central, verified
# 2026-11-18: decoders include ac3/eac3/dca/mlp/truehd, native libs
# 16KB ELF-aligned on all 4 ABIs, FFmpeg 6.0 LGPL (no --enable-gpl).
nextlib = "1.8.0-0.9.0"
room = "2.8.5"
datastore = "1.3.0"
securityCrypto = "1.1.0"
coil = "2.7.0"
coroutines = "1.11.0"
# Compose (v2.6.0) — BOM matched to Kotlin 2.2.21; the mock's
# BOM 2024.02.02 + compiler 1.5.10 (Kotlin 1.9.22) are NOT used.
composeBom = "2025.10.00"
activityCompose = "1.10.1"
tdlib = "0.1.1"
recyclerviewAnimators = "4.0.2"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
nextlib-media3ext = { group = "io.github.anilbeesetti", name = "nextlib-media3ext", version.ref = "nextlib" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
# v2.6.0 Compose UI (BOM-managed versions — no version.ref here).
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
tdlib-core = { group = "io.github.tdlib-android", name = "core", version.ref = "tdlib" }
tdlib-ktx = { group = "io.github.tdlib-android", name = "ktx", version.ref = "tdlib" }
recyclerview-animators = { group = "jp.wasabeef", name = "recyclerview-animators", version.ref = "recyclerviewAnimators" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
